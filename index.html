<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08283F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Logist · Remisiones y cotizaciones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
@font-face{font-family:'Montserrat';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/montserrat-400.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/montserrat-500.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/montserrat-600.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/cormorant-500.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/cormorant-600.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/cormorant-700.woff2) format('woff2')}
:root{
  --navy:#08283F; --gold:#B39555;
  --bg:#FBFAF7; --card:#FFFFFF; --ink:#1D2B36; --mute:#6B7480; --line:#E6E1D5; --tint:#F3F0E8;
  --primary:#08283F; --on-primary:#FFFFFF; --accent:#8F7438; --danger:#9B2C2C;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1923; --card:#13232F; --ink:#EEEBE3; --mute:#9AA6B0; --line:#25384A; --tint:#192C3A;
    --primary:#C9AB6B; --on-primary:#0D1923; --accent:#C9AB6B; --danger:#E08A8A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --card:#13232F; --ink:#EEEBE3; --mute:#9AA6B0; --line:#25384A; --tint:#192C3A;
  --primary:#C9AB6B; --on-primary:#0D1923; --accent:#C9AB6B; --danger:#E08A8A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink)}
.app{max-width:600px;margin:0 auto;padding:0 16px 120px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Inicio */
.hero{text-align:center;padding:28px 0 8px}
.hero img{width:168px;height:auto;display:block;margin:0 auto}
.hero .rule{width:64px;height:2px;background:var(--gold);margin:14px auto 10px}
.hero p{margin:0;color:var(--mute);font-size:13px;letter-spacing:.02em}
.actions{display:grid;gap:12px;margin:22px 0 8px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:10px;padding:18px 18px;cursor:pointer;min-height:76px}
.big svg{width:30px;height:30px;flex:none}
.big b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
.big span{font-size:12.5px;opacity:.8}
.big.p{background:var(--primary);color:var(--on-primary)}
.big.s{background:transparent;color:var(--ink);border:1.5px solid var(--gold)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 8px}
.sec h2{font-size:22px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:6px 0}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font-size:24px;flex:1}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib svg{width:22px;height:22px}

/* Listas */
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%;cursor:pointer}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12.5px;color:var(--mute);flex:none}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--gold);color:var(--accent);margin-bottom:2px}
.badge.r2{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--mute);font-size:14px}

/* Formularios */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:22px;margin-bottom:10px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px 12px;font-size:16px;min-height:46px}
.f textarea{resize:vertical;min-height:80px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.item .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;font-size:13px;color:var(--mute)}
.item .hd button{border:0;background:none;color:var(--danger);display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12.5px;min-height:36px}
.item .hd svg{width:16px;height:16px}
.item .f{margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1.5px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:600;font-size:14.5px;padding:12px 16px;min-height:48px;cursor:pointer}
.btn svg{width:19px;height:19px}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.g{background:transparent;color:var(--accent);border-color:var(--gold)}
.btn.d{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.w{width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar .btn{flex:1;min-width:130px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.sw small{display:block;color:var(--mute);font-size:12px}
.sw input{width:22px;height:22px;accent-color:var(--primary)}
.live{display:flex;justify-content:space-between;font-weight:600;padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;min-height:36px}
.hint{font-size:12.5px;color:var(--mute);margin:4px 0 10px}
.logoedit{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.logoedit img{width:84px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);cursor:pointer;min-height:56px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--accent);font-weight:600}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.actbar>div{max-width:600px;margin:0 auto}

/* Documento (vista previa) - siempre papel blanco */
.sheetwrap{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);background:#fff}
.sheet{width:794px;min-height:1000px;background:#fff;color:#1D2B36;padding:52px 56px 44px;transform-origin:top left;font-family:'Montserrat',system-ui,sans-serif;font-size:12.5px;line-height:1.5;position:relative}
.sheet .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.sheet .hdr img{height:96px;width:auto}
.sheet .tt{text-align:right}
.sheet .tt h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:36px;letter-spacing:.14em;color:#08283F;font-weight:600;line-height:1;margin:6px 0 8px}
.sheet .tt .n{color:#8F7438;font-weight:600;font-size:15px}
.sheet .tt .dt{color:#6B7480;font-size:12px;margin-top:2px}
.sheet .gl{height:2px;background:#B39555;margin:20px 0 22px}
.sheet .parties{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.sheet .parties h4{margin:0 0 6px;font-size:12px;color:#8F7438;font-weight:600;letter-spacing:.04em}
.sheet .parties p{margin:0;font-size:12px;color:#33414C}
.sheet .parties p.b{font-weight:600;color:#08283F;font-size:13px}
.sheet .meta{display:flex;gap:18px;background:#F6F3EC;border-radius:4px;padding:10px 14px;margin:20px 0 6px}
.sheet .meta div{flex:1;font-size:12px;font-weight:600;color:#08283F}
.sheet .meta small{display:block;font-size:10.5px;color:#6B7480;font-weight:500}
.sheet table{width:100%;border-collapse:collapse;margin-top:18px}
.sheet th{background:#08283F;color:#fff;font-size:11px;font-weight:600;text-align:left;padding:8px 9px}
.sheet td{padding:8px 9px;border-bottom:1px solid #E6E1D5;font-size:12px;vertical-align:top}
.sheet tr:nth-child(even) td{background:#FAF8F3}
.sheet .c{text-align:center}.sheet .rt{text-align:right}
.sheet .tot{margin:14px 0 0 auto;width:280px;font-size:12.5px}
.sheet .tot div{display:flex;justify-content:space-between;padding:4px 0;color:#33414C}
.sheet .tot .gt{border-top:2px solid #B39555;margin-top:4px;padding-top:8px;font-weight:600;color:#08283F;font-size:14px}
.sheet .units{text-align:right;margin-top:12px;font-weight:600;color:#08283F}
.sheet .box{background:#F6F3EC;border-radius:4px;padding:10px 14px;margin-top:18px;font-size:12px;color:#33414C;white-space:pre-wrap}
.sheet .box b{display:block;color:#8F7438;font-size:12px;margin-bottom:3px}
.sheet .sig{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:40px}
.sheet .sig .sp{height:58px;display:flex;align-items:flex-end}
.sheet .sig img{max-height:54px;max-width:200px}
.sheet .sig .ln{border-top:1px solid #08283F;padding-top:5px;font-size:11.5px;color:#33414C}
.sheet .sig .ln b{color:#08283F;font-size:12.5px;display:block}
.sheet .sig h4{margin:0 0 4px;font-size:12px;color:#8F7438;font-weight:600}
.sheet .ft{margin-top:34px;padding-top:10px;border-top:1px solid #E6E1D5;text-align:center;font-size:10.5px;color:#6B7480}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:11px 18px;border-radius:99px;font-size:13.5px;z-index:20;max-width:90vw;text-align:center}
.modalbg{position:fixed;inset:0;background:rgba(5,15,25,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal{background:var(--card);border-radius:12px;padding:20px;max-width:440px;width:100%;max-height:86vh;overflow:auto}
.modal h2{font-size:24px;margin-bottom:8px}
.modal p{margin:0 0 12px;color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>

let mem=null;
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  let d=DEFAULTS();
  if(raw){try{const p=JSON.parse(raw);d.settings=Object.assign(d.settings,p.settings||{});d.counters=Object.assign(d.counters,p.counters||{});d.clients=p.clients||[];d.docs=p.docs||[]}catch(e){}}
  else if(mem){d=mem}
  if(d.settings.titular&&!d.settings.configurado)d.settings.configurado=true;
  return d;
}
let DB=load();
function persist(){mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}

/* ================== Numeración y totales ================== */
function nextNum(tipo){
  const c=DB.counters[tipo],yr=new Date().getFullYear();
  let n=c.n; if(DB.settings.resetAnual&&c.year!==yr)n=1;
  const yy=String(yr).slice(2);
  return {n,yr,num:DB.settings.prefijo+'-'+tipo+'-'+yy+'-'+String(n).padStart(4,'0')};
}
function totals(d){
  const sub=d.items.reduce((a,i)=>a+(i.cant||0)*(i.precio||0),0);
  const desc=Math.round(sub*(d.descPct||0)/100);
  const base=sub-desc;
  const iva=d.aplicaIva?Math.round(base*(d.ivaPct||0)/100):0;

/* ================== Pegar lista ================== */
const UN=['unidades','unidad','unids','unid','und','unds','u','cajas','caja','kilos','kilo','kg','paquetes','paquete','pqt','bultos','bulto','rollos','rollo','pares','par','metros','metro','mts','m','litros','litro','lt','galones','galon','gal','sacos','saco','pallets','pallet','estibas','estiba'];
const UNRE=UN.join('|');
function normUnit(u){
  if(!u)return null; u=u.toLowerCase();
  const m={unidades:'und',unidad:'und',unids:'und',unid:'und',unds:'und',u:'und',cajas:'caja',kilos:'kg',kilo:'kg',paquetes:'paquete',pqt:'paquete',bultos:'bulto',rollos:'rollo',pares:'par',metros:'m',metro:'m',mts:'m',litros:'lt',litro:'lt',galones:'gal',galon:'gal',sacos:'saco',pallets:'pallet',estibas:'pallet',estiba:'pallet'};
  return m[u]||u;
}
function parseList(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(raw=>{
    let l=raw.replace(/^\s*[-•*·]\s+/,'').replace(/^\s*\d+[.)]\s+/,'').trim();
    if(!l)return;
    let m,cant=1,und=null,desc=l;
    if((m=l.match(new RegExp('^(\\d+(?:[.,]\\d+)?)\\s*('+UNRE+')?\\.?\\s*(?:x|de)?\\s+(.+)$','i')))){cant=m[1];und=m[2];desc=m[3]}
    else if((m=l.match(new RegExp('^(.+?)\\s*(?:[-–:=]|\\bx\\b|\\bcant(?:idad)?\\.?)\\s*(\\d+(?:[.,]\\d+)?)\\s*('+UNRE+')?\\.?$','i')))){desc=m[1];cant=m[2];und=m[3]}
    else if((m=l.match(new RegExp('^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*('+UNRE+')\\.?$','i')))){desc=m[1];cant=m[2];und=m[3]}
    out.push({cod:'',desc:desc.trim(),und:normUnit(und)||(DB.settings.unidades[0]||'und'),cant:parseFloat(String(cant).replace(',','.'))||1,precio:0});
  });
  return out;
}

function buildPDF(d){

    y+=16;
  } else y+=4;
  // Tabla
  const hasCod=d.items.some(i=>i.cod);
  const head=['Ítem'].concat(hasCod?['Código']:[],['Descripción','Unidad','Cantidad'],pr?['V. unitario','Total']:[]);
  const body=d.items.map((i,k)=>[String(k+1)].concat(hasCod?[i.cod||'']:[],[i.desc,i.und,fq(i.cant)],pr?[cop(i.precio),cop(i.cant*i.precio)]:[]));
  const ci={};let k=0;ci[k++]={halign:'center',cellWidth:12};if(hasCod)ci[k++]={cellWidth:24};ci[k++]={halign:'left'};ci[k++]={halign:'center',cellWidth:20};ci[k++]={halign:'center',cellWidth:20};if(pr){ci[k++]={halign:'right',cellWidth:28};ci[k++]={halign:'right',cellWidth:30}}
  doc.autoTable({

    didParseCell:h=>{if(h.section==='head'){const col=ci[h.column.index];if(col&&col.halign)h.cell.styles.halign=col.halign}},
    didDrawCell:h=>{if(h.section==='body'){doc.setDrawColor(230,225,213);doc.setLineWidth(.2);doc.line(h.cell.x,h.cell.y+h.cell.height,h.cell.x+h.cell.width,h.cell.y+h.cell.height)}},

  });

  const ly=y+19;doc.setDrawColor(...NAVY);doc.setLineWidth(.3);doc.line(sx,ly,sx+lw2,ly);if(isR)doc.line(rx,ly,rx+lw2,ly);
  let sy=ly+4.5;
  doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...NAVY);doc.text(e.titular,sx,sy);sy+=4.4;

function navHTML(){
  const it=[['home','Inicio','home'],['history','Historial','clock'],['clients','Clientes','users'],['settings','Ajustes','gear']];
  return '<nav class="nav"><div>'+it.map(x=>'<button class="'+(ui.screen===x[0]?'on':'')+'" data-act="tab" data-s="'+x[0]+'">'+ic(x[2])+x[1]+'</button>').join('')+'</div></nav>';

function render(){
  const R=$('#root');let h='';
  switch(ui.screen){
    case 'home':h=homeHTML();break;
    case 'history':h=historyHTML();break;
    case 'clients':h=clientsHTML();break;
    case 'clientForm':h=clientFormHTML(ui.client);break;
    case 'settings':h=settingsHTML();break;
    case 'editor':h=editorHTML(ui.draft);break;
    case 'preview':h=previewHTML(ui.draft);break;
  }
  const full=['editor','preview','clientForm'].includes(ui.screen);
  R.innerHTML='<div class="app">'+h+'</div>'+(full?'':navHTML());
  if(ui.screen==='preview')fit();
}
function fit(){
  const w=$('#sw'),s=$('#sheet');if(!w||!s)return;
  const sc=Math.min(1,w.clientWidth/794);s.style.transform='scale('+sc+')';w.style.height=(s.offsetHeight*sc)+'px';
}
window.addEventListener('resize',fit);
function updateLive(){const d=ui.draft;if(!d)return;const e=$('#live');if(!e)return;const t=totals(d);e.textContent=usesPrices(d)?cop(t.total):fq(t.units)}

/* ================== Eventos ================== */
function getP(o,p){return p.split('.').reduce((a,k)=>a&&a[k],o)}
function setP(o,p,v){const ks=p.split('.'),l=ks.pop();ks.reduce((a,k)=>a[k],o)[l]=v}
function applyBind(t){
  const b=t.dataset.bind;if(!b)return false;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.kind==='num')v=parseFloat(String(v).replace(',','.'))||0;
  if(t.dataset.kind==='money')v=num(v);
  if(t.dataset.kind==='list')v=String(v).split(',').map(x=>x.trim()).filter(Boolean);
  if(b.startsWith('cfg.')){setP(DB.settings,b.slice(4),v);persist()}
  else if(b.startsWith('cnt.')){const k=b.slice(4);DB.counters[k]={year:new Date().getFullYear(),n:Math.max(1,parseInt(v)||1)};persist()}
  else if(b.startsWith('client.')){setP(ui.client,b.slice(7),v)}
  else{setP(ui.draft,b,v);updateLive()}
  return true;
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.actInput==='q'){ui.q=t.value;const pos=t.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}return}
  applyBind(t);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pick){const c=DB.clients.find(x=>x.id===t.value);if(c){ui.draft.cliente={nombre:c.nombre,doc:c.doc||'',dir:c.dir||'',ciudad:c.ciudad||'',contacto:c.contacto||'',tel:c.tel||''};render()}return}
  if(t.dataset.file){handleFile(t);return}
  if(applyBind(t)){if(t.dataset.rerender||t.dataset.bind.startsWith('cnt.')||t.dataset.bind==='cfg.prefijo'||t.dataset.bind==='cfg.resetAnual')render()}
});
function readImg(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/im.width),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cb(c.toDataURL('image/png'),w,h)};im.onerror=()=>toast('No se pudo leer la imagen');im.src=r.result};
  r.readAsDataURL(file);
}
function handleFile(t){
  const f=t.files&&t.files[0];if(!f)return;const k=t.dataset.file;
  if(k==='logo')readImg(f,600,(u,w,h)=>{DB.settings.logo=u;DB.settings.logoW=w;DB.settings.logoH=h;persist();render();toast('Logo actualizado')});
  if(k==='firma')readImg(f,500,(u)=>{DB.settings.firmaImg=u;persist();render();toast('Firma agregada')});
  if(k==='import'){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p||!Array.isArray(p.docs))throw 0;modal({title:'Restaurar respaldo',text:'Esto reemplaza los datos actuales de este dispositivo por los del respaldo ('+p.docs.length+' documentos).',ok:'Restaurar',danger:true,cb:()=>{const d=DEFAULTS();d.settings=Object.assign(d.settings,p.settings||{});d.counters=Object.assign(d.counters,p.counters||{});d.clients=p.clients||[];d.docs=p.docs;DB=d;persist();render();toast('Respaldo restaurado')}})}catch(x){toast('El archivo no es un respaldo válido')}};r.readAsText(f)}
  t.value='';
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=ui.draft;
  switch(a){
    case 'tab':go(b.dataset.s,{draft:null,saved:false});break;
    case 'new':if(!DB.settings.configurado){toast('Primero completa los datos de tu empresa');go('settings',{draft:null});break}ui.draft=newDraft(b.dataset.t);ui.saved=false;go('editor');break;
    case 'finishSetup':{const s=DB.settings;if(!s.empresa.trim()||!s.titular.trim()||!s.tel.trim()){toast('Completa al menos empresa, titular y celular');return}s.configurado=true;persist();go('home');toast('Datos guardados. Ya puedes crear documentos');break}
    case 'filter':ui.filter=b.dataset.v;render();break;
    case 'addItem':d.items.push({cod:'',desc:'',und:DB.settings.unidades[0]||'und',cant:1,precio:0});render();setTimeout(()=>{const i=document.querySelectorAll('[data-bind$=".desc"]');if(i.length)i[i.length-1].focus()},30);break;
    case 'delItem':d.items.splice(+b.dataset.i,1);render();break;
    case 'pasteOpen':modal({title:'Pegar lista',text:'Pega la lista tal como te llegó (una línea por artículo). Revisa las cantidades antes de continuar.',body:'<label class="f"><span>Ejemplo: Tornillo 3/8 x 200 · 5 cajas de guantes · Cinta - 12</span><textarea rows="8" placeholder="Pega aquí la lista"></textarea></label>',ok:'Convertir en artículos',cb:v=>{const r=parseList(v||'');if(!r.length){toast('No se encontraron artículos');return}if(d.items.length===1&&!d.items[0].desc.trim())d.items=[];d.items=d.items.concat(r);render();toast(r.length+' artículos agregados. Revisa las cantidades.')}});break;
    case 'cancel':{const o=d&&d.id&&DB.docs.find(z=>z.id===d.id);if(o){ui.draft=JSON.parse(JSON.stringify(o));ui.saved=true;go('preview',{from:'list'})}else go('home',{draft:null});break}
    case 'preview':if(!validate(d))return;ui.from='editor';ui.saved=false;go('preview');break;
    case 'backEdit':go('editor');break;
    case 'closePrev':go('history',{draft:null,saved:false});break;
    case 'open':{const x=DB.docs.find(z=>z.id===b.dataset.id);if(x){ui.draft=JSON.parse(JSON.stringify(x));ui.saved=true;go('preview',{from:'list'})}break}
    case 'edit':ui.from='editor';go('editor');break;
    case 'dup':{const nd=JSON.parse(JSON.stringify(d));nd.id=null;nd.num=null;nd.tipo=b.dataset.t;nd.fecha=today();delete nd.emisor;delete nd.creado;if(nd.tipo==='COT'){nd.validez=DB.settings.validezDias;nd.cond=DB.settings.condCOT}ui.draft=nd;ui.saved=false;go('editor');break}
    case 'delDoc':modal({title:'Eliminar documento',text:'Se borrará '+d.num+' del historial. El consecutivo no se reutiliza.',ok:'Eliminar',danger:true,cb:()=>{DB.docs=DB.docs.filter(z=>z.id!==d.id);persist();go('history',{draft:null,saved:false});toast('Documento eliminado')}});break;
    case 'share':case 'download':
      if(!validate(d))return;
      if(!ui.saved)commit();
      render();
      a==='share'?await doShare(d):await doDownload(d);break;
    case 'clientNew':go('clientForm',{client:{nombre:'',doc:'',dir:'',ciudad:'',contacto:'',tel:''}});break;
    case 'clientEdit':go('clientForm',{client:Object.assign({},DB.clients.find(c=>c.id===b.dataset.id))});break;
    case 'clientSave':{const c=ui.client;if(!c.nombre.trim()){toast('Falta el nombre del cliente');return}if(c.id){const k=DB.clients.find(x=>x.id===c.id);Object.assign(k,c)}else DB.clients.push(Object.assign({id:uid()},c));persist();go('clients');toast('Cliente guardado');break}
    case 'clientDel':modal({title:'Eliminar cliente',text:'Los documentos ya emitidos no cambian.',ok:'Eliminar',danger:true,cb:()=>{DB.clients=DB.clients.filter(x=>x.id!==ui.client.id);persist();go('clients')}});break;
    case 'logoReset':DB.settings.logo=null;DB.settings.logoW=520;DB.settings.logoH=441;persist();render();break;
    case 'firmaDel':DB.settings.firmaImg=null;persist();render();break;
    case 'export':{const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});await savePDFFile('respaldo-logist-'+today()+'.json',blob,'Respaldo guardado');break}
  }
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
render();
</script>
</body>
</html>
